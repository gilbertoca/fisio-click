# ============================================================================

# Inser\u00e7\u00e3o das linhas de amarra\u00e7\u00e3o de itens (Transaction Line Items)
faturamento_item.create=\
    INSERT INTO fisio.faturamento_item(faturamento_id, sessao_id, valor_item) \
    VALUES (:idFaturamento, :idSessao, :valorItem)

# Inser\u00e7\u00e3o direta de parcelas vinculadas ao caixa. O bind l\u00ea propriedades planas do modelo RecebimentoParcela.
recebimento_parcela.create=\
    INSERT INTO fisio.recebimento_parcela (faturamento_id, numero_parcela, valor_parcela, data_vencimento, parcela_situacao, data_pagamento, pagamento_meio) \
    VALUES (:idFaturamento, :numeroParcela, :valorParcela, :dataVencimento, :situacao, :dataPagamento, :pagamentoMeio)

# ============================================================================
# ============================================================================
# M\u00c3\u0093DULO DE SEGURAN\u00c3\u0087A (USU\u00c3\u0081RIO)
# ============================================================================
# O hash/salt NUNCA vaza para a listagem \u00e2\u0080\u0094 s\u00c3\u00b3 a query de AUTENTICA\u00c3\u0087\u00c3\u0083O
# (getByUsername) traz as colunas de credencial. O hash \u00c3\u00a9 gravado pelo
# UsuarioService via PasswordHasher.
usuario.getPapeis=\
    SELECT p.papel_id AS id, p.nome, p.descricao \
    FROM fisio.usuario_papel up \
    JOIN fisio.papel p ON p.papel_id = up.papel_id \
    WHERE up.usuario_id = :usuarioId ORDER BY p.nome ASC
# Permiss\u00c3\u00b5es efetivas do usu\u00c3\u00a1rio: uni\u00e3o das permiss\u00c3\u00b5es de todos os pap\u00c3\u00a9is.
usuario.getPermissoes=\
    SELECT DISTINCT per.nome \
    FROM fisio.usuario_papel up \
    JOIN fisio.permissao_papel pp ON pp.papel_id = up.papel_id \
    JOIN fisio.permissao per ON per.permissao_id = pp.permissao_id \
    WHERE up.usuario_id = :usuarioId

# ============================================================================
# M\u00c3\u0093DULO DE SEGURAN\u00c3\u0087A \u00e2\u0080\u0094 TELAS (FASE 4)
# ============================================================================
# A listagem e a consulta de tela JAMAIS trazem senha/salt (s\u00c3\u00b3 a de
# autentica\u00e7\u00e3o os l\u00c3\u00aa). O hash \u00c3\u00a9 gravado pelo UsuarioService via PasswordHasher.
usuario.getAllLike=\
    SELECT u.usuario_id AS id, u.nome, u.username, u.email, u.ativo, \
           (SELECT LISTAGG(p.nome, ', ') WITHIN GROUP (ORDER BY p.nome) \
              FROM fisio.usuario_papel up \
              JOIN fisio.papel p ON p.papel_id = up.papel_id \
             WHERE up.usuario_id = u.usuario_id) AS nomesPapeis \
    FROM fisio.usuario u \
    WHERE (:nome IS NULL OR UPPER(u.nome) LIKE UPPER(:nome)) \
      AND (:username IS NULL OR UPPER(u.username) LIKE UPPER(:username)) \
    ORDER BY u.nome ASC
usuario.getByUsername=\
    SELECT usuario_id AS id, nome, username, email, senha, salt, ativo, \
           profissional_id AS "profissional.id" \
    FROM fisio.usuario WHERE username = :username
usuario.get=\
    SELECT usuario_id AS id, nome, username, email, ativo, \
           profissional_id AS "profissional.id" \
    FROM fisio.usuario WHERE usuario_id = :id
usuario.countByUsername=\
    SELECT COUNT(*) FROM fisio.usuario \
    WHERE username = :username AND (:id IS NULL OR usuario_id <> :id)
usuario.create=\
    INSERT INTO fisio.usuario (nome, username, email, senha, salt, ativo) \
    VALUES (:nome, :username, :email, :senha, :salt, :ativo)
usuario.update=\
    UPDATE fisio.usuario SET nome = :nome, username = :username, \
           email = :email, ativo = :ativo \
    WHERE usuario_id = :id
usuario.updateSenha=\
    UPDATE fisio.usuario SET senha = :senha, salt = :salt WHERE usuario_id = :id
# A exclus\u00e3o de usu\u00c3\u00a1rio n\u00e3o tem tela: o acesso se gerencia pelo Ativo
# (SIM/N\u00c3\u0083O), no padr\u00e3o do CredBem. deletePapeis fica para o alterar.
usuario.deletePapeis=\
    DELETE FROM fisio.usuario_papel WHERE usuario_id = :usuarioId
usuario.createPapel=\
    INSERT INTO fisio.usuario_papel (usuario_id, papel_id) \
    VALUES (:usuarioId, :papelId)

# Pap\u00c3\u00a9is do formul\u00c3\u00a1rio e o vocabul\u00c3\u00a1rio completo de permiss\u00c3\u00b5es (cada
# permiss\u00e3o nasce via SQL quando surge um recurso/tela \u00e2\u0080\u0094 n\u00e3o tem CRUD).
papel.getAll=\
    SELECT papel_id AS id, nome, descricao \
    FROM fisio.papel ORDER BY papel_id ASC
permissao.getAll=\
    SELECT nome FROM fisio.permissao WHERE nome <> '*' ORDER BY nome ASC
papel.getPermissoes=\
    SELECT per.nome \
    FROM fisio.permissao_papel pp \
    JOIN fisio.permissao per ON per.permissao_id = pp.permissao_id \
    WHERE pp.papel_id = :papelId ORDER BY per.nome ASC
