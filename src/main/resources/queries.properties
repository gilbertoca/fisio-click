profissional.delete=DELETE FROM fisio.profissional WHERE profissional_id = :id
# Dependentes do profissional (guard de dele\u00e7\u00e3o): sess\u00c3\u00b5es da agenda.
profissional.countDependentes=SELECT COUNT(*) FROM fisio.sessao WHERE profissional_id = :id

profissional.getAllLikeNome=\
    SELECT p.profissional_id AS id, p.nome AS nome, p.cpf AS cpf, p.dt_nascimento AS dtNascimento, \
           p.email AS email, p.telefone AS telefone, \
           p.registro_numero AS registroNumero, p.registro_orgao AS registroOrgao \
    FROM fisio.profissional p \
    WHERE (:nome IS NULL OR :nome = '' OR LOWER(p.nome) LIKE CONCAT('%', LOWER(:nome), '%')) \
    ORDER BY p.nome ASC

profissional.getByLogin=\
    SELECT p.profissional_id AS id, p.nome AS nome, p.cpf AS cpf, p.dt_nascimento AS dtNascimento, \
           p.email AS email, p.telefone AS telefone, \
           p.registro_numero AS registroNumero, p.registro_orgao AS registroOrgao \
    FROM fisio.profissional p WHERE p.login = :login

# ============================================================================
# MODALIDADE (SERVICE) CRUD
# ============================================================================
modalidade.get=SELECT modalidade_id As id, nome, duracao_minutos AS duracaoMinutos, valor_base AS valorBase, capacidade_simultanea AS capacidadeSimultanea FROM fisio.modalidade WHERE modalidade_id = :id
modalidade.getAll=SELECT modalidade_id As id, nome, duracao_minutos AS duracaoMinutos, valor_base AS valorBase, capacidade_simultanea AS capacidadeSimultanea FROM fisio.modalidade ORDER BY nome ASC
modalidade.create=INSERT INTO fisio.modalidade (nome, duracao_minutos, valor_base, capacidade_simultanea) VALUES (:nome, :duracaoMinutos, :valorBase, :capacidadeSimultanea)
modalidade.update=UPDATE fisio.modalidade SET nome = :nome, duracao_minutos = :duracaoMinutos, valor_base = :valorBase, capacidade_simultanea = :capacidadeSimultanea WHERE modalidade_id = :id
modalidade.delete=DELETE FROM fisio.modalidade WHERE modalidade_id = :id
# Dependentes da modalidade (guard de dele\u00e7\u00e3o): procedimentos amarrados
# (opcional, mas se existem o cat\u00c3\u00a1logo perde a amarra) + sess\u00c3\u00b5es.
modalidade.countDependentes=SELECT (SELECT COUNT(*) FROM fisio.procedimento WHERE modalidade_id = :id) + (SELECT COUNT(*) FROM fisio.sessao WHERE modalidade_id = :id)
modalidade.getAllLikeNome=SELECT modalidade_id As id, nome, duracao_minutos AS duracaoMinutos, valor_base AS valorBase, capacidade_simultanea AS capacidadeSimultanea FROM fisio.modalidade WHERE (:nome IS NULL OR :nome = '' OR LOWER(nome) LIKE CONCAT('%', LOWER(:nome), '%')) ORDER BY nome ASC

# ============================================================================
# PROCEDIMENTO (CATALOGO) CRUD + guard de uso no roteiro
# ============================================================================
# LEFT JOIN modalidade: a amarra \u00c3\u00a9 opcional no DDL (procedimento de uso geral).
procedimento.get=\
    SELECT p.procedimento_id AS id, p.nome, p.codigo_tuss AS codigoTuss, p.procedimento_situacao AS situacao, \
           m.modalidade_id AS "modalidade.id", m.nome AS "modalidade.nome" \
    FROM fisio.procedimento p \
    LEFT JOIN fisio.modalidade m ON p.modalidade_id = m.modalidade_id \
    WHERE p.procedimento_id = :id
procedimento.getAll=\
    SELECT p.procedimento_id AS id, p.nome, p.codigo_tuss AS codigoTuss, p.procedimento_situacao AS situacao, \
           m.modalidade_id AS "modalidade.id", m.nome AS "modalidade.nome" \
    FROM fisio.procedimento p \
    LEFT JOIN fisio.modalidade m ON p.modalidade_id = m.modalidade_id \
    ORDER BY p.nome ASC
procedimento.getAllLikeNome=\
    SELECT p.procedimento_id AS id, p.nome, p.codigo_tuss AS codigoTuss, p.procedimento_situacao AS situacao, \
           m.modalidade_id AS "modalidade.id", m.nome AS "modalidade.nome" \
    FROM fisio.procedimento p \
    LEFT JOIN fisio.modalidade m ON p.modalidade_id = m.modalidade_id \
    WHERE (:nome IS NULL OR :nome = '' OR LOWER(p.nome) LIKE CONCAT('%', LOWER(:nome), '%')) \
    ORDER BY p.nome ASC
# Cat\u00c3\u00a1logo completo de UMA modalidade (todos os estados) \u00e2\u0080\u0094 painel da
# modalidade (ModalidadeProcedimentoViewPage), na ordem do cat\u00c3\u00a1logo.
procedimento.getByModalidade=\
    SELECT p.procedimento_id AS id, p.nome, p.codigo_tuss AS codigoTuss, p.procedimento_situacao AS situacao \
    FROM fisio.procedimento p \
    WHERE p.modalidade_id = :modalidadeId \
    ORDER BY p.nome ASC
procedimento.create=\
    INSERT INTO fisio.procedimento (modalidade_id, nome, codigo_tuss, procedimento_situacao) \
    VALUES (:modalidadeId, :nome, :codigoTuss, :situacao)
procedimento.update=\
    UPDATE fisio.procedimento SET modalidade_id = :modalidadeId, nome = :nome, codigo_tuss = :codigoTuss, \
           procedimento_situacao = :situacao \
    WHERE procedimento_id = :id
procedimento.delete=DELETE FROM fisio.procedimento WHERE procedimento_id = :id
# Sugest\u00c3\u00b5es de conduta para a sala: itens ATIVO de uso geral (sem amarra)
# OU amarrados \u00c3\u00a0 modalidade da sess\u00e3o em atendimento.
procedimento.getSugestoesPorModalidade=\
    SELECT p.procedimento_id AS id, p.nome, p.codigo_tuss AS codigoTuss, p.procedimento_situacao AS situacao, \
           m.modalidade_id AS "modalidade.id", m.nome AS "modalidade.nome" \
    FROM fisio.procedimento p \
    LEFT JOIN fisio.modalidade m ON p.modalidade_id = m.modalidade_id \
    WHERE p.procedimento_situacao = 'ATIVO' \
      AND (p.modalidade_id IS NULL OR p.modalidade_id = :modalidadeId) \
    ORDER BY p.nome ASC
# Guard de dele\u00e7\u00e3o: FK restritiva de sessao_procedimento \u00e2\u0080\u0094 procedimento usado
# em roteiro cl\u00c3\u00adnico \u00c3\u00a9 hist\u00c3\u00b3rico e n\u00e3o sai do cat\u00c3\u00a1logo (vira INATIVO).
procedimento.countUsoEmSessoes=\
    SELECT COUNT(*) FROM fisio.sessao_procedimento WHERE procedimento_id = :id

# ============================================================================
# SESSAO_PROCEDIMENTO (ROTEIRO / CONDUTAS DA SESSAO)
# ============================================================================
# Roteiro da sess\u00e3o com o grafo do cat\u00c3\u00a1logo (procedimento + modalidade) \u00e2\u0080\u0094
# sugest\u00e3o e listagem resolvem em uma ida ao banco.
sessao_procedimento.getBySessao=\
    SELECT sp.sessao_id AS sessaoId, sp.procedimento_id AS procedimentoId, sp.observacao, \
           p.procedimento_id AS "procedimento.id", p.nome AS "procedimento.nome", \
           p.codigo_tuss AS "procedimento.codigoTuss", p.procedimento_situacao AS "procedimento.situacao", \
           m.modalidade_id AS "procedimento.modalidade.id", m.nome AS "procedimento.modalidade.nome" \
    FROM fisio.sessao_procedimento sp \
    JOIN fisio.procedimento p ON sp.procedimento_id = p.procedimento_id \
    LEFT JOIN fisio.modalidade m ON p.modalidade_id = m.modalidade_id \
    WHERE sp.sessao_id = :sessaoId \
    ORDER BY p.nome ASC
sessao_procedimento.getItem=\
    SELECT sp.sessao_id AS sessaoId, sp.procedimento_id AS procedimentoId, sp.observacao, \
           p.procedimento_id AS "procedimento.id", p.nome AS "procedimento.nome", \
           p.codigo_tuss AS "procedimento.codigoTuss", p.procedimento_situacao AS "procedimento.situacao", \
           m.modalidade_id AS "procedimento.modalidade.id", m.nome AS "procedimento.modalidade.nome" \
    FROM fisio.sessao_procedimento sp \
    JOIN fisio.procedimento p ON sp.procedimento_id = p.procedimento_id \
    LEFT JOIN fisio.modalidade m ON p.modalidade_id = m.modalidade_id \
    WHERE sp.sessao_id = :sessaoId AND sp.procedimento_id = :procedimentoId
sessao_procedimento.insert=\
    INSERT INTO fisio.sessao_procedimento (sessao_id, procedimento_id, observacao) \
    VALUES (:sessaoId, :procedimentoId, :observacao)
sessao_procedimento.updateObservacao=\
    UPDATE fisio.sessao_procedimento SET observacao = :observacao \
    WHERE sessao_id = :sessaoId AND procedimento_id = :procedimentoId
sessao_procedimento.delete=\
    DELETE FROM fisio.sessao_procedimento \
    WHERE sessao_id = :sessaoId AND procedimento_id = :procedimentoId

# ============================================================================
# SESSAO (APPOINTMENT) CRUD & VALIDATIONS
# ============================================================================
# Estados ativos para conflito de agenda: AGENDADA, CONFIRMADA e EM_ANDAMENTO.
# Regra de grupo: overlap \u00c3\u00a9 permitido na MESMA modalidade at\u00c3\u00a9 esgotar
# modalidade.capacidade_simultanea (ex.: pilates com 4 pacientes). Overlap com
# modalidade DIFERENTE \u00c3\u00a9 sempre conflito (o profissional n\u00e3o divide o foco).
# :sessaoId null na cria\u00e7\u00e3o; preenchido na edi\u00e7\u00e3o (exclui a pr\u00f3pria sess\u00e3o).
sessao.verificarConflitoOutraModalidade=\
    SELECT COUNT(*) FROM fisio.sessao \
    WHERE profissional_id = :profissionalId \
      AND sessao_situacao IN ('AGENDADA', 'CONFIRMADA', 'EM_ANDAMENTO') \
      AND (:dataHoraInicio < dt_hora_fim AND :dataHoraFim > dt_hora_inicio) \
      AND modalidade_id <> :modalidadeId \
      AND (:sessaoId IS NULL OR sessao_id <> :sessaoId)

sessao.verificarCapacidadeGrupo=\
    SELECT COUNT(*) FROM fisio.sessao \
    WHERE profissional_id = :profissionalId \
      AND sessao_situacao IN ('AGENDADA', 'CONFIRMADA', 'EM_ANDAMENTO') \
      AND (:dataHoraInicio < dt_hora_fim AND :dataHoraFim > dt_hora_inicio) \
      AND modalidade_id = :modalidadeId \
      AND (:sessaoId IS NULL OR sessao_id <> :sessaoId)

# Atendimentos do profissional no dia (lista da tela da sala), com flag de
# registro do atendimento (registro_dt_inicio marcado no iniciarAtendimento)
sessao.findGridAgenda=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, s.pagamento_origem AS pagamentoOrigem, \
           s.observacoes_recepcao AS observacoesRecepcao, \
           (s.registro_dt_inicio IS NOT NULL) AS possuiProntuario, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", c.cpf AS \"cliente.cpf\", \
           conv.convenio_id AS \"cliente.convenio.id\", conv.nome AS \"cliente.convenio.nome\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE s.dt_hora_inicio >= :inicioDia AND s.dt_hora_inicio < :fimDia \
      AND (:profissionalNome IS NULL OR :profissionalNome = '' OR LOWER(p.nome) LIKE CONCAT('%', LOWER(:profissionalNome), '%')) \
    ORDER BY s.dt_hora_inicio ASC

# Guarda de exclus\u00e3o: leitura do estado atual da sess\u00e3o
sessao.getSituacao=\
    SELECT sessao_situacao AS situacao FROM fisio.sessao WHERE sessao_id = :id

# Transi\u00e7\u00f5es de situa\u00e7\u00e3o do ciclo operacional, checadas na aplica\u00e7\u00e3o via
# SessaoSituacao.podeTransicionarPara. O registro de atendimento \u00c3\u00a9 coluna da
# pr\u00f3pria sess\u00e3o (1:1): iniciar marca registro_dt_inicio (idempotente via
# COALESCE); finalizar marca registro_dt_fim.
sessao.iniciarAtendimento=\
    UPDATE fisio.sessao SET sessao_situacao = 'EM_ANDAMENTO', \
           registro_dt_inicio = COALESCE(registro_dt_inicio, CURRENT_TIMESTAMP) \
    WHERE sessao_id = :id

sessao.finalizarAtendimento=\
    UPDATE fisio.sessao SET sessao_situacao = 'REALIZADA', \
           registro_dt_fim = COALESCE(registro_dt_fim, CURRENT_TIMESTAMP) \
    WHERE sessao_id = :id

# Grava\u00e7\u00e3o do registro do atendimento na sala (textos cl\u00c3\u00adnicos); os
# registro_dt_* s\u00e3o marcados apenas pelas transi\u00e7\u00f5es acima
sessao.updateRegistro=\
    UPDATE fisio.sessao SET registro_relato = :registroRelato, registro_avaliacao = :registroAvaliacao, \
           registro_conduta = :registroConduta, registro_orientacoes = :registroOrientacoes \
    WHERE sessao_id = :id

sessao.get=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, s.pagamento_origem AS pagamentoOrigem, \
           s.observacoes_recepcao AS observacoesRecepcao, \
           (s.registro_dt_inicio IS NOT NULL) AS possuiProntuario, \
           s.registro_relato AS registroRelato, s.registro_avaliacao AS registroAvaliacao, \
           s.registro_conduta AS registroConduta, s.registro_orientacoes AS registroOrientacoes, \
           s.registro_dt_inicio AS registroDtInicio, s.registro_dt_fim AS registroDtFim, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", c.cpf AS \"cliente.cpf\", \
           conv.convenio_id AS \"cliente.convenio.id\", conv.nome AS \"cliente.convenio.nome\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE s.sessao_id = :id

# Todos os registros de sessao (agenda atual e futura), ordenados pela ultima
# insercao: as sessoes recem-agendadas aparecem no topo. Filtro de nome do
# profissional encaminhado pela pagina (Column.setFilterBy + getFilters).
sessao.getAll=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, s.pagamento_origem AS pagamentoOrigem, \
           s.observacoes_recepcao AS observacoesRecepcao, \
           (s.registro_dt_inicio IS NOT NULL) AS possuiProntuario, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", c.cpf AS \"cliente.cpf\", \
           conv.convenio_id AS \"cliente.convenio.id\", conv.nome AS \"cliente.convenio.nome\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE (:profissionalNome IS NULL OR :profissionalNome = '' OR LOWER(p.nome) LIKE CONCAT('%', LOWER(:profissionalNome), '%')) \
    ORDER BY s.sessao_id DESC

# Painel do cliente: TODAS as sessoes do cliente (agendadas e atendidas \u00e2\u0080\u0094
# todos os estados do ciclo), mais recentes primeiro, com o grafo rico
# (profissional, modalidade) para a tabela do painel.
sessao.getAllPorCliente=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, s.pagamento_origem AS pagamentoOrigem, \
           s.observacoes_recepcao AS observacoesRecepcao, \
           (s.registro_dt_inicio IS NOT NULL) AS possuiProntuario, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", c.cpf AS \"cliente.cpf\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE s.cliente_id = :clienteId \
    ORDER BY s.dt_hora_inicio DESC

# Painel do profissional: TODAS as sessoes dele (agendadas e atendidas \u00e2\u0080\u0094
# todos os estados do ciclo), mais recentes primeiro, com o grafo rico
# (cliente, modalidade) para a tabela do painel.
sessao.getAllPorProfissional=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, s.pagamento_origem AS pagamentoOrigem, \
           s.observacoes_recepcao AS observacoesRecepcao, \
           (s.registro_dt_inicio IS NOT NULL) AS possuiProntuario, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", c.cpf AS \"cliente.cpf\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE p.profissional_id = :profissionalId \
    ORDER BY s.dt_hora_inicio DESC

# ============================================================================
# COCKPIT DA HOME: \u00c3\u00baltimos registros de cada fluxo
# ============================================================================
# Fila da recep\u00e7\u00e3o: sess\u00c3\u00b5es ainda n\u00e3o atendidas (AGENDADA/CONFIRMADA), as
# rec\u00c3\u00a9m-criadas primeiro. Sem convenio: o cockpit n\u00e3o consome o grafo todo.
sessao.getUltimasNaFila=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE s.sessao_situacao IN ('AGENDADA', 'CONFIRMADA') \
    ORDER BY s.sessao_id DESC \
    LIMIT :limite

# Sala de atendimento: \u00c3\u00baltimos atendimentos com registro iniciado \u00e2\u0080\u0094 EM_ANDAMENTO
# em curso e REALIZADAS recentes. FALTOU/CANCELADA n\u00e3o aparecem (registro_dt_inicio
# s\u00c3\u00b3 \u00c3\u00a9 marcado quando o atendimento inicia).
sessao.getUltimosAtendimentos=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, \
           (s.registro_dt_inicio IS NOT NULL) AS possuiProntuario, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE s.registro_dt_inicio IS NOT NULL \
    ORDER BY s.registro_dt_inicio DESC \
    LIMIT :limite

# Agenda do dia: intervalo sarg\u00c3\u00a1vel (aproveita idx_sessao_prof_agenda / \u00c3\u00adndices de data)
sessao.findGridAgenda=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, s.pagamento_origem AS pagamentoOrigem, \
           s.observacoes_recepcao AS observacoesRecepcao, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", c.cpf AS \"cliente.cpf\", \
           conv.convenio_id AS \"cliente.convenio.id\", conv.nome AS \"cliente.convenio.nome\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE s.dt_hora_inicio >= :inicioDia AND s.dt_hora_inicio < :fimDia \
      AND (:profissionalNome IS NULL OR :profissionalNome = '' OR LOWER(p.nome) LIKE CONCAT('%', LOWER(:profissionalNome), '%')) \
    ORDER BY s.dt_hora_inicio ASC

sessao.create=\
    INSERT INTO fisio.sessao (cliente_id, profissional_id, modalidade_id, dt_hora_inicio, dt_hora_fim, sessao_tipo, pagamento_origem, sessao_situacao, observacoes_recepcao) \
    VALUES (:clienteId, :profissionalId, :modalidadeId, :dataHoraInicio, :dataHoraFim, :sessaoTipo, :pagamentoOrigem, :situacao, :observacoesRecepcao)

sessao.update=\
    UPDATE fisio.sessao SET cliente_id = :clienteId, profissional_id = :profissionalId, modalidade_id = :modalidadeId, \
                      dt_hora_inicio = :dataHoraInicio, dt_hora_fim = :dataHoraFim, sessao_tipo = :sessaoTipo, \
                      pagamento_origem = :pagamentoOrigem, sessao_situacao = :situacao, observacoes_recepcao = :observacoesRecepcao \
    WHERE sessao_id = :id

sessao.delete=DELETE FROM fisio.sessao WHERE sessao_id = :id

# Agenda de atendimentos do profissional logado (tela da sala), intervalo sarg\u00c3\u00a1vel
sessao.findAgendaProfissional=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, s.pagamento_origem AS pagamentoOrigem, \
           s.observacoes_recepcao AS observacoesRecepcao, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", c.cpf AS \"cliente.cpf\", \
           conv.convenio_id AS \"cliente.convenio.id\", conv.nome AS \"cliente.convenio.nome\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE s.profissional_id = :profissionalId \
      AND s.dt_hora_inicio >= :inicioDia AND s.dt_hora_inicio < :fimDia \
    ORDER BY s.dt_hora_inicio ASC

# ============================================================================
# FATURAMENTO (BILLING MODULE) CRUD - SUFIXO OPERACIONAL (rascunho V2)
# ============================================================================

# Mapeamento do get que monta a raiz e prepara as propriedades para o Grafo Rico
faturamento.get=\
    SELECT f.faturamento_id AS id, f.pagamento_origem AS pagamentoOrigem, \
           f.valor_bruto AS valorBruto, f.valor_desconto AS valorDesconto, f.valor_liquido AS valorLiquido, \
           f.data_emissao AS dataEmissao, f.faturamento_situacao AS situacao, f.observacoes AS observacoes, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\" \
    FROM fisio.faturamento f \
    JOIN fisio.cliente c ON f.cliente_id = c.cliente_id \
    WHERE f.faturamento_id = :id

# Listagem central do Cockpit Financeiro
faturamento.getAll=\
    SELECT f.faturamento_id AS id, f.pagamento_origem AS pagamentoOrigem, \
           f.valor_bruto AS valorBruto, f.valor_desconto AS valorDesconto, f.valor_liquido AS valorLiquido, \
           f.data_emissao AS dataEmissao, f.faturamento_situacao AS situacao, f.observacoes AS observacoes, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\" \
    FROM fisio.faturamento f \
    JOIN fisio.cliente c ON f.cliente_id = c.cliente_id \
    ORDER BY f.data_emissao DESC

# Nota de Escrita: O bind l\u00ea 'pagamentoOrigem', 'valorBruto', 'valorDesconto', 'valorLiquido',
# 'dataEmissao', 'situacao', 'observacoes'. A invariante liquido = bruto - desconto
# \u00e9 mantida pelos setters do modelo.
# O ID do cliente \u00e9 mapeado de forma expl\u00edcita caso n\u00e3o use interceptores planos na raiz da entidade.
faturamento.create=\
    INSERT INTO fisio.faturamento (cliente_id, pagamento_origem, convenio_id, valor_bruto, valor_desconto, valor_liquido, data_emissao, faturamento_situacao, observacoes) \
    VALUES (:clienteId, :pagamentoOrigem, :convenioId, :valorBruto, :valorDesconto, :valorLiquido, :dataEmissao, :situacao, :observacoes)

faturamento.update=\
    UPDATE fisio.faturamento SET faturamento_situacao = :situacao, observacoes = :observacoes \
    WHERE faturamento_id = :id

faturamento.delete=\
    DELETE FROM fisio.faturamento WHERE faturamento_id = :id

faturamento.getAllLikeSituacao=\
    SELECT f.faturamento_id AS id, f.pagamento_origem AS pagamentoOrigem, \
           f.valor_bruto AS valorBruto, f.valor_desconto AS valorDesconto, f.valor_liquido AS valorLiquido, \
           f.data_emissao AS dataEmissao, f.faturamento_situacao AS situacao, f.observacoes AS observacoes, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\" \
    FROM fisio.faturamento f \
    JOIN fisio.cliente c ON f.cliente_id = c.cliente_id \
    WHERE LOWER(f.faturamento_situacao) LIKE LOWER(:situacao) \
    ORDER BY f.data_emissao DESC

# ============================================================================
