# ============================================================================
# CONVENIO (INSURANCE) CRUD
# ============================================================================
convenio.get=SELECT convenio_id As id, nome, cnpj, endereco, bairro, cep, cidade FROM fisio.convenio WHERE convenio_id = :id
convenio.getAll=SELECT convenio_id As id, nome, cnpj, endereco, bairro, cep, cidade FROM fisio.convenio ORDER BY nome ASC
convenio.create=INSERT INTO fisio.convenio (nome, cnpj, endereco, bairro, cep, cidade) VALUES (:nome, :cnpj, :endereco, :bairro, :cep, :cidade)
convenio.update=UPDATE fisio.convenio SET nome = :nome, cnpj = :cnpj, endereco = :endereco, bairro = :bairro, cep = :cep, cidade = :cidade WHERE convenio_id = :id
convenio.delete=DELETE FROM fisio.convenio WHERE convenio_id = :id
convenio.getAllLikeNome=SELECT convenio_id As id, nome, cnpj, endereco, bairro, cep, cidade FROM fisio.convenio WHERE (:nome IS NULL OR :nome = '' OR LOWER(nome) LIKE CONCAT('%', LOWER(:nome), '%')) ORDER BY nome ASC
# Dependentes do conv\u00c3\u00aanio (guard de dele\u00e7\u00e3o): clientes amarrados (FK
# restritiva em fisio.cliente) + faturamentos (lote de conv\u00c3\u00aanio).
convenio.countDependentes=SELECT (SELECT COUNT(*) FROM fisio.cliente WHERE convenio_id = :id) + (SELECT COUNT(*) FROM fisio.faturamento WHERE convenio_id = :id)

# ============================================================================
# CLIENTE (PATIENT) CRUD
# ============================================================================
cliente.get=\
    SELECT c.cliente_id AS id, c.nome AS nome, c.cpf AS cpf, c.dt_nascimento AS dtNascimento, \
           c.email AS email, c.telefone AS telefone, c.cliente_situacao AS situacao, \
                      c.convenio_numero AS convenioNumero, \
           c.endereco AS endereco, c.bairro AS bairro, c.cep AS cep, c.cidade AS cidade, \
           conv.convenio_id AS \"convenio.id\", conv.nome AS \"convenio.nome\" \
    FROM fisio.cliente c \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    WHERE c.cliente_id = :id

cliente.getAll=\
    SELECT c.cliente_id AS id, c.nome AS nome, c.cpf AS cpf, c.dt_nascimento AS dtNascimento, \
           c.email AS email, c.telefone AS telefone, c.cliente_situacao AS situacao, \
                      c.convenio_numero AS convenioNumero, \
           c.endereco AS endereco, c.bairro AS bairro, c.cep AS cep, c.cidade AS cidade, \
           conv.convenio_id AS \"convenio.id\", conv.nome AS \"convenio.nome\" \
    FROM fisio.cliente c \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    ORDER BY c.nome ASC

cliente.create=\
    INSERT INTO fisio.cliente (nome, cpf, dt_nascimento, email, telefone, cliente_situacao, convenio_numero, convenio_id, endereco, bairro, cep, cidade) \
    VALUES (:nome, :cpf, :dtNascimento, :email, :telefone, :situacao, :convenioNumero, :convenioId, :endereco, :bairro, :cep, :cidade)

cliente.update=\
    UPDATE fisio.cliente SET nome = :nome, cpf = :cpf, dt_nascimento = :dtNascimento, \
                       email = :email, telefone = :telefone, cliente_situacao = :situacao, \
                       convenio_numero = :convenioNumero, convenio_id = :convenioId, \
                       endereco = :endereco, bairro = :bairro, cep = :cep, cidade = :cidade \
    WHERE cliente_id = :id

cliente.delete=DELETE FROM fisio.cliente WHERE cliente_id = :id
# Dependentes do cliente (guard de dele\u00e7\u00e3o): sess\u00c3\u00b5es (hist\u00c3\u00b3rico da agenda) +
# faturamentos (conta do cliente ou lote em que ele aparece).
cliente.countDependentes=SELECT (SELECT COUNT(*) FROM fisio.sessao WHERE cliente_id = :id) + (SELECT COUNT(*) FROM fisio.faturamento WHERE cliente_id = :id)

cliente.getAllLikeNome=\
    SELECT c.cliente_id AS id, c.nome AS nome, c.cpf AS cpf, c.dt_nascimento AS dtNascimento, \
           c.email AS email, c.telefone AS telefone, c.cliente_situacao AS situacao, \
                      c.convenio_numero AS convenioNumero, \
           c.endereco AS endereco, c.bairro AS bairro, c.cep AS cep, c.cidade AS cidade, \
           conv.convenio_id AS \"convenio.id\", conv.nome AS \"convenio.nome\" \
    FROM fisio.cliente c \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    WHERE (:nome IS NULL OR :nome = '' OR LOWER(c.nome) LIKE CONCAT('%', LOWER(:nome), '%'))  \
    ORDER BY c.nome ASC

# ============================================================================
