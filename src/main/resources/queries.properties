           p.email AS email, p.telefone AS telefone, \
           p.registro_numero AS registroNumero, p.registro_orgao AS registroOrgao \
    FROM fisio.profissional p ORDER BY p.nome ASC

profissional.create=\
    INSERT INTO fisio.profissional (nome, cpf, dt_nascimento, email, telefone, registro_numero, registro_orgao) \
    VALUES (:nome, :cpf, :dtNascimento, :email, :telefone, :registroNumero, :registroOrgao)

