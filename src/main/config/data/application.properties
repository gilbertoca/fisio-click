# Configuracao da instancia (copiada para data/ no pacote).
# Precedencia: variavel de ambiente > este arquivo > padroes do jar.

# Banco. Sem db.url, usa H2 em <appHome>/data/fisio (a pasta precisa existir).
# db.url=jdbc:h2:file:/dados/fisio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
# db.user=sa
# db.password=sa
# server.port=8080

# Certificado autoassinado de desenvolvimento (gerado com keytool).
# Para voltar a HTTP, comente as duas linhas abaixo.
tls.keystore=data/fisio.p12
tls.password=changeit
